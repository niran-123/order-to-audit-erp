version: '3.8'

services:
  # ===========================================================================
  # 1. PostgreSQL Production Database Service
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ordertoaudit_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecureErpPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-ordertoaudit_erp_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/prisma/migrations/20261120000000_init/migration.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ordertoaudit_erp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ===========================================================================
  # 2. Backend API Service
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ordertoaudit_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SuperSecureErpPassword2026!}@postgres:5432/${POSTGRES_DB:-ordertoaudit_erp_prod}?schema=public&connection_limit=20&pool_timeout=30
      CORS_ORIGIN: ${CORS_ORIGIN:-https://erp.yourdomain.com,http://localhost}
      JWT_SECRET: ${JWT_SECRET:-enterprise_prod_secret_order_to_audit_jwt_key_2026!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ===========================================================================
  # 3. Frontend Web Client (Nginx Reverse Proxy & Static SPA)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ordertoaudit_frontend_prod
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  erp_net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
